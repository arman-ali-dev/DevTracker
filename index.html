<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DevTrack - Personal learning and interview preparation tracker."
    />
    <title>DevTrack</title>

    <script>
      try {
        const savedState = JSON.parse(
          localStorage.getItem("prep-tracker:v1") || "{}",
        );

        const theme = savedState?.settings?.theme;

        if (theme === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (error) {
        // Continue with the default theme if stored settings are invalid.
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
